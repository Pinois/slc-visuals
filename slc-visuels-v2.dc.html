<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;background:#050505;overflow:hidden;}
a{color:#e7e7e7;} a:hover{color:#ffffff;}
input[type=range]{accent-color:#e7e7e7;}
input[type=checkbox]{accent-color:#e7e7e7;}
select{background:#101010;color:#aaa;border:1px solid #2a2a2a;border-radius:5px;font-size:11px;padding:3px 5px;font-family:inherit;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#222;border-radius:4px;} ::-webkit-scrollbar-track{background:transparent;}
</style>
</helmet>
<div ref="{{ refStage }}" data-screen-label="{{ screenLabel }}" style="position:fixed;inset:0;background:#050505;font-family:ui-monospace,'SF Mono',Menlo,monospace;user-select:none;overflow:hidden;">
  <canvas ref="{{ refD }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;"></canvas>
  <svg ref="{{ refHidden }}" viewBox="0 0 174 174" style="position:absolute;width:174px;height:174px;left:-9999px;top:0;" aria-hidden="true"></svg>
  <div ref="{{ refUi }}" style="position:absolute;inset:0;pointer-events:none;transition:opacity 0.6s ease;">
    <div style="position:absolute;top:20px;left:24px;color:#555;font-size:12px;letter-spacing:0.14em;">SLC · MOTEUR DE COUCHES</div>
    <div style="position:absolute;top:20px;left:24px;margin-top:22px;color:#3a3a3a;font-size:11px;letter-spacing:0.08em;">F plein écran · H panneau · espace pause · 1–4 presets</div>
    <div ref="{{ refPanel }}" style="position:absolute;top:16px;right:16px;bottom:16px;width:296px;display:flex;flex-direction:column;background:rgba(8,8,8,0.92);border:1px solid #1d1d1d;border-radius:10px;pointer-events:auto;overflow:hidden;">
      <div style="padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;">
        <span style="color:#777;font-size:11px;letter-spacing:0.16em;">COUCHES</span>
        <button onClick="{{ onPanel }}" style="background:transparent;border:1px solid #2a2a2a;color:#777;border-radius:6px;padding:3px 9px;font-family:inherit;font-size:10px;cursor:pointer;">masquer</button>
      </div>
      <div style="padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px;">
        <sc-for list="{{ presets }}" as="pr" hint-placeholder-count="5">
          <button onClick="{{ pr.pick }}" style="background:transparent;border:1px solid #333;color:#999;padding:5px 11px;border-radius:999px;font-family:inherit;font-size:11px;letter-spacing:0.04em;cursor:pointer;">{{ pr.name }}</button>
        </sc-for>
      </div>
      <div style="flex:1;overflow-y:auto;padding:0 16px;">
        <sc-for list="{{ rows }}" as="l" hint-placeholder-count="10">
          <div style="border-top:1px solid #191919;padding:10px 0;">
            <div style="display:flex;align-items:center;gap:9px;">
              <input type="checkbox" checked="{{ l.on }}" onChange="{{ l.toggle }}">
              <span style="flex:1;color:{{ l.nameColor }};font-size:12px;letter-spacing:0.05em;">{{ l.name }}</span>
              <span style="width:34px;text-align:right;color:#5a5a5a;font-size:11px;">{{ l.intLabel }}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:7px;">
              <input type="range" min="0" max="100" value="{{ l.int }}" onChange="{{ l.setInt }}" style="flex:1;">
            </div>
            <sc-if value="{{ l.hasOpt }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;gap:6px;margin-top:7px;">
                <select value="{{ l.opt }}" onChange="{{ l.setOpt }}" style="flex:1;">
                  <sc-for list="{{ l.opts }}" as="o" hint-placeholder-count="2"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                </select>
                <sc-if value="{{ l.hasOpt2 }}" hint-placeholder-val="{{ false }}">
                  <select value="{{ l.opt2 }}" onChange="{{ l.setOpt2 }}" style="flex:1;">
                    <sc-for list="{{ l.opts2 }}" as="o" hint-placeholder-count="2"><option value="{{ o.v }}">{{ o.label }}</option></sc-for>
                  </select>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="border-top:1px solid #1d1d1d;padding:12px 16px;display:flex;flex-direction:column;gap:9px;">
        <div style="display:flex;align-items:center;gap:10px;color:#666;font-size:11px;letter-spacing:0.06em;">
          <span>vitesse</span>
          <input type="range" min="0.2" max="2" step="0.05" value="{{ speed }}" onChange="{{ onSpeed }}" style="flex:1;">
          <span style="min-width:32px;text-align:right;color:#999;">{{ speedLabel }}</span>
        </div>
        <button onClick="{{ onFull }}" style="background:transparent;border:1px solid #333;color:#888;padding:7px 0;border-radius:7px;font-family:inherit;font-size:11px;letter-spacing:0.06em;cursor:pointer;">Plein écran</button>
      </div>
    </div>
    <button ref="{{ refShowBtn }}" onClick="{{ onPanel }}" style="position:absolute;top:16px;right:16px;background:rgba(8,8,8,0.9);border:1px solid #2a2a2a;color:#777;border-radius:8px;padding:7px 13px;font-family:inherit;font-size:11px;cursor:pointer;pointer-events:auto;display:none;">couches</button>
  </div>
</div>
</x-dc>

      const wf = (pp) => st.resp.opt === 'coeur' ? this.heart(pp) : 0.5 + 0.5 * Math.sin(2 * Math.PI * pp - Math.PI / 2);
      w01 = wf(p);
      S = 1 + 0.075 * i * (w01 - 0.35);
      sL = [0, 1, 2].map((k) => 1 + 0.085 * i * (wf(((p - 0.055 * (k + 1)) % 1 + 1) % 1) - 0.35));
      const hr = R * S * (1.3 + 0.45 * w01);
      const gr = a.createRadialGradient(cx, cy, R * S * 0.85, cx, cy, hr);
      const ha = 0.2 * i * (0.25 + 0.75 * w01) * this.glowP();
      gr.addColorStop(0, 'rgba(231,231,231,' + ha.toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(231,231,231,0)');
      a.fillStyle = gr;
      a.beginPath(); a.arc(cx, cy, hr, 0, 2 * Math.PI); a.fill();
    }
    const u = R / 87 * S;
    const baseT = () => a.setTransform(u, 0, 0, u, cx - 87 * u, cy - 87 * u);
    // circle (possibly morphed)
    baseT();
    a.fillStyle = '#2B2B2B';
    a.beginPath();
    if (st.morph.on && st.morph.int > 0) {
      const im = st.morph.int / 100, p = this.ph(20);
      const wt = (this.ss(p, 0.05, 0.18) - this.ss(p, 0.42, 0.55)) * im;
      const wh = (this.ss(p, 0.42, 0.55) - this.ss(p, 0.86, 0.97)) * im;
      const rot = 2 * Math.PI * p;
      const n = 160;
      for (let i = 0; i <= n; i++) {
        const th = i / n * 2 * Math.PI;
        const rr = 87 * ((1 - wt - wh) + wt * this.polyR(th + rot, 3) + wh * this.polyR(th + rot, 6));
        const x = 87 + rr * Math.cos(th), y = 87 + rr * Math.sin(th);
        if (i) a.lineTo(x, y); else a.moveTo(x, y);
      }
      a.closePath();
    } else {
      a.arc(87, 87, 87, 0, 2 * Math.PI);
    }
    a.fill();
    // letters
    const dust = st.burst.on && st.burst.opt === 'poussiere' && this.eB > 0.004;
    const e = this.eB;
    for (let i = 0; i < 3; i++) {
      baseT();
      const c = this.LC[i];
      a.translate(c.cx, c.cy); a.scale(sL[i], sL[i]); a.translate(-c.cx, -c.cy);
      a.globalAlpha = dust ? Math.max(0, 1 - e * 1.6) : 1;
      a.fillStyle = '#E7E7E7';
      if (a.globalAlpha > 0.01) a.fill(this.P[i]);
    }
    if (dust) {
      baseT();
      a.fillStyle = '#E7E7E7';
      const vis = Math.min(1, e * 4);
      for (let j = 0; j < this.pts.length; j++) {
        const pt = this.pts[j];
        const ee = Math.pow(e, pt.exp);
        const ang = pt.ang + pt.spin * e * 2.5;
        a.globalAlpha = (1 - 0.72 * ee) * vis;
        a.fillRect(pt.x + Math.cos(ang) * pt.mag * ee, pt.y + Math.sin(ang) * pt.mag * ee, 1.3, 1.3);
      }
    }
    a.globalAlpha = 1;
    a.setTransform(1, 0, 0, 1, 0, 0);
  }

  liquidPass(src, dst, iMa, iMi) {
    const W = this.W, H = this.H, R = this.R;
    dst.setTransform(1, 0, 0, 1, 0, 0); dst.globalAlpha = 1; dst.globalCompositeOperation = 'source-over';
    dst.clearRect(0, 0, W, H);
    const ampMa = 0.055 * R * iMa, ampMi = 0.014 * R * iMi;
    const pMa = this.ph(10), pMi = this.ph(3);
    const h = iMi > 0 ? 3 : 6;
    const TP = 2 * Math.PI;
    for (let y = 0; y < H; y += h) {
      let dx = 0;
      if (ampMa) dx += ampMa * Math.sin(TP * (y / H * 1.8) + TP * pMa);
      if (ampMi) dx += ampMi * Math.sin(TP * (y / H * 16) - TP * pMi * 2);
      dst.drawImage(src, 0, y, W, h, dx, y, W, h);
    }
  }

  chunkPass(src, dst) {
    const W = this.W, H = this.H, R = this.R, e = this.eB;
    dst.setTransform(1, 0, 0, 1, 0, 0); dst.globalAlpha = 1; dst.globalCompositeOperation = 'source-over';
    dst.clearRect(0, 0, W, H);
    const x0 = this.cx - R * 1.15, y0 = this.cy - R * 1.15, sz = R * 2.3 / 6;
    for (let i = 0; i < 36; i++) {
      const cr = this.chunkR[i];
      const sx = x0 + (i % 6) * sz, sy = y0 + Math.floor(i / 6) * sz;
      const ox = cr.ax * cr.m * e * R * 0.7, oy = cr.ay * cr.m * e * R * 0.7;
      dst.save();
      dst.translate(sx + sz / 2 + ox, sy + sz / 2 + oy);
      dst.rotate(cr.rot * e);
      dst.globalAlpha = 1 - 0.3 * e;
      dst.drawImage(src, sx, sy, sz, sz, -sz / 2, -sz / 2, sz, sz);
      dst.restore();
    }
  }

  kaleidoPass(src, k, ik) {
    const W = this.W, H = this.H, cx = this.cx, cy = this.cy;
    k.setTransform(1, 0, 0, 1, 0, 0); k.globalAlpha = 1; k.globalCompositeOperation = 'source-over';
    k.clearRect(0, 0, W, H);
    const rot = 2 * Math.PI * this.ph(36);
    const RR = Math.hypot(W, H);
    k.save(); k.translate(cx, cy);
    k.globalAlpha = ik;
    for (let s = 0; s < 6; s++) {
      k.save();
      k.rotate(rot + s * Math.PI / 3);
      if (s % 2) k.scale(1, -1);
      k.beginPath(); k.moveTo(0, 0); k.arc(0, 0, RR, -Math.PI / 6 - 0.02, Math.PI / 6 + 0.02); k.closePath(); k.clip();
      k.rotate(-rot * 0.5);
      k.drawImage(src, -cx, -cy);
      k.restore();
    }
    k.restore();
    k.globalAlpha = 1 - ik;
    if (k.globalAlpha > 0.01) k.drawImage(src, 0, 0);
    k.globalAlpha = 1;
  }

  tunnelPass(f, i) {
    const W = this.W, H = this.H, cx = this.cx, cy = this.cy, R = this.R;
    const maxR = Math.hypot(W, H) / 2 * 1.05, minR = R * 0.7;
    const p = this.ph(9), n = 9;
    f.strokeStyle = '#E7E7E7';
    for (let j = 0; j < n; j++) {
      const k = (j / n + p) % 1;
      const rr = minR * Math.pow(maxR / minR, 1 - k);
      const a = i * 0.4 * this.ss(k, 0, 0.15) * (1 - this.ss(k, 0.78, 1)) * (rr > R * 0.98 ? 1 : 0);
      if (a < 0.005) continue;
      f.globalAlpha = a;
      f.lineWidth = Math.max(1, rr * 0.012);
      f.beginPath(); f.arc(cx, cy, rr, 0, 2 * Math.PI); f.stroke();
    }
    f.globalAlpha = 1;
  }

  scanPass(f, Lc, i) {
    const W = this.W, H = this.H;
    const p = this.ph(7);
    const y0 = (p * 1.3 - 0.15) * H, bh = 0.055 * H;
    const sy = Math.max(0, y0 - bh / 2), sh = Math.min(H - sy, bh);
    if (sh > 1) {
      f.globalCompositeOperation = 'lighter';
      f.globalAlpha = 0.5 * i;
      f.drawImage(this.cv[Lc === this.cv.K ? 'K' : (Lc === this.cv.A ? 'A' : 'B')], 0, sy, W, sh, 0.02 * W * i, sy, W, sh);
      f.globalAlpha = 1;
    }
    const g = f.createLinearGradient(0, y0 - bh, 0, y0 + bh);
    const la = 0.45 * i * this.glowP();
    g.addColorStop(0, 'rgba(231,231,231,0)');
    g.addColorStop(0.5, 'rgba(231,231,231,' + la.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(231,231,231,0)');
    f.fillStyle = g;
    f.fillRect(0, y0 - bh, W, bh * 2);
    f.globalCompositeOperation = 'source-over';
  }

  glitchPass(st) {
    const W = this.W, H = this.H, d = this.x.D;
    d.setTransform(1, 0, 0, 1, 0, 0); d.globalAlpha = 1; d.globalCompositeOperation = 'source-over';
    d.fillStyle = '#050505'; d.fillRect(0, 0, W, H);
    let g = 0, tick = 0;
    if (st.glitch.on && st.glitch.int > 0) {
      const i = st.glitch.int / 100;
      if (st.glitch.opt === 'rafales') {
        const tt = ((this.tA % 24) + 24) % 24;
        for (let b = 0; b < this.bursts.length; b++) {
          const t0 = this.bursts[b], dur = 0.32;
          if (tt >= t0 && tt < t0 + dur) { g = i * Math.sin(Math.PI * (tt - t0) / dur); break; }
        }
        tick = Math.floor(tt * 30);
      } else {
        const p = this.ph(4); tick = Math.floor(p * 48);
        const active = this.rand(tick) < 0.12 + 0.72 * i;
        g = active ? i * (0.35 + 0.65 * this.rand(tick + 3)) : 0;
      }
    }
    const F = this.cv.F;
    if (g <= 0.003) { d.drawImage(F, 0, 0); return; }
    const rr = (k) => this.rand(tick * 9.13 + k);
    const ga = rr(1) < 0.12 * g ? 0.25 : 1;
    if (g > 0.22) {
      const dx = W * 0.008 * g * g * (0.5 + rr(2)) + 1;
      const tr = this.x.tR, tc = this.x.tC;
      tr.setTransform(1, 0, 0, 1, 0, 0); tr.globalCompositeOperation = 'source-over'; tr.clearRect(0, 0, W, H);
      tr.drawImage(F, 0, 0); tr.globalCompositeOperation = 'source-in'; tr.fillStyle = '#FF2A55'; tr.fillRect(0, 0, W, H);
      tc.setTransform(1, 0, 0, 1, 0, 0); tc.globalCompositeOperation = 'source-over'; tc.clearRect(0, 0, W, H);
      tc.drawImage(F, 0, 0); tc.globalCompositeOperation = 'source-in'; tc.fillStyle = '#22D3EE'; tc.fillRect(0, 0, W, H);
      d.globalCompositeOperation = 'lighter'; d.globalAlpha = 0.75 * ga;
      d.drawImage(this.cv.tR, dx, (rr(3) - 0.5) * 3);
      d.drawImage(this.cv.tC, -dx, (rr(8) - 0.5) * 3);
      d.globalCompositeOperation = 'source-over';
    }
    d.globalAlpha = ga;
    d.drawImage(F, (rr(4) - 0.5) * 8 * g, (rr(5) - 0.5) * 4 * g);
    d.globalAlpha = 1;
    if (g > 0.15) {
      const ns = Math.floor(1 + 4 * g * rr(6));
      for (let s = 0; s < ns; s++) {
        const y = rr(20 + s) * H * 0.9, h = (0.01 + 0.05 * rr(30 + s)) * H, off = (rr(40 + s) - 0.5) * W * 0.07 * g;
        d.drawImage(F, 0, y, W, h, off, y, W, h);
      }
    }
  }

  renderVals() {
    const st = this.state.L;
    const rows = this.DEFS.map((def) => {
      const l = st[def.k];
      return {
        name: def.name,
        nameColor: l.on ? '#E7E7E7' : '#5a5a5a',
        on: l.on,
        int: l.int,
        intLabel: l.int + '%',
        toggle: (e) => this.setLayer(def.k, { on: e.target.checked }),
        setInt: (e) => this.setLayer(def.k, { int: +e.target.value }),
        hasOpt: !!def.opts,
        opts: def.opts || [],
        opt: l.opt,
        setOpt: (e) => this.setLayer(def.k, { opt: e.target.value }),
        hasOpt2: !!def.opts2,
        opts2: def.opts2 || [],
        opt2: l.opt2,
        setOpt2: (e) => this.setLayer(def.k, { opt2: e.target.value }),
      };
    });
    const presets = this.PRESETS.map((pr) => ({ name: pr.name, pick: () => this.applyPreset(pr) }));
    const active = this.DEFS.filter((d) => st[d.k].on).map((d) => d.name).join(' + ') || 'Statique';
    return {
      rows, presets,
      speed: this.state.speed,
      speedLabel: this.state.speed.toFixed(2).replace(/0$/, '') + '×',
      onSpeed: (e) => this.setState({ speed: parseFloat(e.target.value) }),
      onFull: () => this.goFull(),
      onPanel: () => this.togglePanel(),
      screenLabel: 'Couches : ' + active,
      refStage: this.ref('Stage'), refD: this.ref('D'), refHidden: this.ref('Hidden'),
      refUi: this.ref('Ui'), refPanel: this.ref('Panel'), refShowBtn: this.ref('ShowBtn'),
    };
  }
}
</script>
